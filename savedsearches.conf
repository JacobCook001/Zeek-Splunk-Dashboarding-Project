# Zeek NSM — Scheduled Alert Definitions
# Deploy to: $SPLUNK_HOME/etc/apps/<your_app>/default/savedsearches.conf
# All searches query index=zeek. Adjust cron_schedule and dispatch windows to taste.
#
# Severity scale: 5=critical  4=high  3=medium
# alert.track = 1  →  results appear in Splunk Alert Manager
# realtime_schedule = 0  →  use dispatch time (recommended for accuracy)

##############################################################################
# CRITICAL — active exploitation / confirmed TTP
##############################################################################

[Alert - Intel Indicator Match]
search = index=zeek source="*intel.log" | stats count by id.orig_h, id.resp_h, seen.indicator, seen.indicator_type, sources | where count > 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
realtime_schedule = 0

[Alert - BZAR Lateral Movement Notice T1021]
search = index=zeek source="*notice.log" (note="*ATTACK*" OR note="*Lateral*" OR note="*BZAR*") | stats count by id.orig_h, id.resp_h, note, msg | where count > 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
realtime_schedule = 0

[Alert - Kerberoasting TGS RC4-HMAC T1558.003]
