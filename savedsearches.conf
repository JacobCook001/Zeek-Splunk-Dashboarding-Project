[Alert - Golden Silver Ticket Anomalous Lifetime T1558.001]
search = index=zeek source="*kerberos.log" | where isnotnull(till) AND till!="" | eval till_clean=replace(till, "\.\d+$", "") | eval till_epoch=strptime(till_clean, "%Y-%m-%dT%H:%M:%S") | eval till_days=round((till_epoch - now()) / 86400, 1) | where till_days > 30 OR till_days < 0 | stats count by id.orig_h, id.resp_h, client, service, till, till_days
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
realtime_schedule = 0

