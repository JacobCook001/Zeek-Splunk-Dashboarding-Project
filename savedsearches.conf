[Alert - Beaconing Low Jitter Periodic Callback T1071]
search = index=zeek source="*conn.log" | where NOT match(id.resp_h, "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)") | sort 0 id.orig_h, id.resp_h, id.resp_p, _time | streamstats current=f last(_time) AS prev_time BY id.orig_h, id.resp_h, id.resp_p | eval interval_sec=_time - prev_time | where interval_sec > 0 AND interval_sec < 3600 | stats avg(interval_sec) AS avg_interval, stdev(interval_sec) AS stdev_interval, count AS connections by id.orig_h, id.resp_h, id.resp_p | where connections > 5 | eval jitter_pct=round(stdev_interval / avg_interval * 100, 1) | where jitter_pct < 10
dispatch.earliest_time = -6h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 0
alert.track = 1
realtime_schedule = 0
